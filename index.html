<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowPay - Cash Flow & Bill Coverage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 40px;
        }

        /* Header */
        header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #f8fafc;
        }

        .btn-bank {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main Grid */
        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
        }

        /* Cards */
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 600;
        }

        .amount-large {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 8px 0 4px 0;
            color: #ffffff;
        }

        .subtext {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .btn-link {
            background: none;
            border: none;
            color: #818cf8;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        /* Forms & Inputs */
        label {
            display: block;
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 6px;
            margin-top: 8px;
        }

        input[type="number"], input[type="text"], input[type="date"], select {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #6366f1;
        }

        .btn-action {
            background-color: #e11d48;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        .btn-primary {
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Feedback Box */
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .feedback-safe {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .feedback-danger {
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 8px;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #1e293b;
        }

        .btn-del {
            background: none;
            border: none;
            color: #f43f5e;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        .modal-content {
            background-color: #1e293b;
            border: 1px solid #334155;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 20px;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-icon">$</div>
            <div class="brand-title">FlowPay</div>
        </div>
        <button onclick="openModal('modal-bank')" class="btn-bank" id="bank-btn-label">Connect Bank</button>
    </header>

    <!-- Main Container -->
    <main>

        <!-- TOP INDICATORS -->
        <div class="grid-4">
            
            <!-- Balance Card -->
            <div class="card">
                <div class="flex-between">
                    <span class="card-title">Current Balance</span>
                    <button onclick="openBalanceModal()" class="btn-link">Edit</button>
                </div>
                <div class="amount-large" id="display-balance">$0.00</div>
                <div class="subtext" id="sync-status">Status: Manual Entry</div>
            </div>

            <!-- Next Bill Spotlight -->
            <div class="card" style="border-left: 4px solid #6366f1;">
                <div class="flex-between">
                    <span class="card-title" style="color: #818cf8;">Next Upcoming Bill</span>
                    <span class="subtext" id="next-bill-due-days">Due soon</span>
                </div>
                <div class="flex-between" style="margin-top: 6px;">
                    <span id="next-bill-title" style="font-weight: 700;">--</span>
                    <span id="next-bill-cost" style="font-weight: 700; color: #818cf8;">$0.00</span>
                </div>
                <div class="subtext" id="next-bill-status-text" style="margin-top: 8px;">Calculating coverage...</div>
            </div>

            <!-- Bills Period Total -->
            <div class="card">
                <div class="flex-between">
                    <span class="card-title">Bills Total</span>
                    <select id="timeframe-select" onchange="renderAll()" style="width: auto; padding: 2px 6px;">
                        <option value="week">Next 7 Days</option>
                        <option value="month" selected>This Month</option>
                    </select>
                </div>
                <div class="amount-large" id="display-bills-total">$0.00</div>
                <div class="subtext flex-between">
                    <span>Surplus/Deficit:</span>
                    <span id="display-net-surplus" style="font-weight: 700;">$0.00</span>
                </div>
            </div>

            <!-- Target Income -->
            <div class="card">
                <div class="flex-between">
                    <span class="card-title" style="color: #34d399;">Target Weekly Income</span>
                    <button onclick="openSavingsModal()" class="btn-link" style="color: #34d399;">Goal</button>
                </div>
                <div class="amount-large" id="display-weekly-target">$0.00</div>
                <div class="subtext">Covers bills + <span id="display-savings-goal">$0.00</span>/mo savings</div>
            </div>

        </div>

        <!-- MIDDLE SECTION: Spend Logger & Paycheck Calculator -->
        <div class="grid-2">
            
            <!-- Quick Spend Logger -->
            <div class="card">
                <span class="card-title" style="color: #f43f5e; margin-bottom: 8px; display: block;">Log Quick Expense</span>
                
                <label>Amount ($)</label>
                <input type="number" id="spend-amt" placeholder="0.00" oninput="previewSpendImpact()">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label>Category</label>
                        <select id="spend-cat">
                            <option>Groceries</option>
                            <option>Dining Out</option>
                            <option>Gas / Transport</option>
                            <option>Shopping</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label>Note</label>
                        <input type="text" id="spend-note" placeholder="Coffee, Dinner...">
                    </div>
                </div>

                <button onclick="logSpend()" class="btn-action">Deduct & Recalculate</button>

                <div id="spend-impact-box" class="feedback feedback-safe hidden"></div>
            </div>

            <!-- Future Paycheck & Overtime Calculator -->
            <div class="card">
                <span class="card-title" style="color: #34d399; margin-bottom: 8px; display: block;">Future Paycheck Calculator</span>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label>Hourly Rate ($)</label>
                        <input type="number" id="pay-rate" placeholder="22.50" oninput="calculatePaycheck()">
                    </div>
                    <div>
                        <label>Reg. Hours (≤40)</label>
                        <input type="number" id="pay-reg-hrs" value="40" oninput="calculatePaycheck()">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label>Overtime Hours (1.5x)</label>
                        <input type="number" id="pay-ot-hrs" value="0" oninput="calculatePaycheck()">
                    </div>
                    <div>
                        <label>Est. Tax Rate (%)</label>
                        <input type="number" id="pay-tax-rate" value="25" oninput="calculatePaycheck()">
                    </div>
                </div>

                <div style="margin-top:
