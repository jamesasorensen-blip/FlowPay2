name: Staging session revocation UI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/staging-session-revocation-ui.mjs'
      - 'tests/staging-session-revocation-ui.test.mjs'
      - '.github/workflows/staging-session-revocation-ui.yml'
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --check scripts/staging-session-revocation-ui.mjs
      - run: node --test tests/staging-session-revocation-ui.test.mjs
