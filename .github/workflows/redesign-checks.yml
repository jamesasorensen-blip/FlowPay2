name: FlowPay redesign checks
on:
  push:
    branches: [design/financial-clarity-navigation]
  pull_request:
    paths:
      - 'server.js'
      - 'financial-display.mjs'
      - 'cashflow-simulator.mjs'
      - 'financial-view-adapter.mjs'
      - 'bill-record-adapter.mjs'
      - 'receipt-reconciliation.mjs'
      - 'flowpay-navigation.mjs'
      - 'tests/**'
      - 'preview/**'
      - 'design/**'
      - '.github/workflows/redesign-checks.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Run redesign tests
        run: node --test tests/financial-display.test.mjs tests/flowpay-navigation.test.mjs tests/cashflow-simulator.test.mjs tests/financial-view-adapter.test.mjs tests/redesign-preview-route.test.mjs tests/redesign-http.test.mjs tests/bill-record-adapter.test.mjs tests/receipt-reconciliation.test.mjs
      - name: Validate preview structure
        run: |
          test -s preview/redesign.html
          grep -q 'data-panel="home"' preview/redesign.html
          grep -q 'data-panel="activity"' preview/redesign.html
          grep -q 'data-panel="debt"' preview/redesign.html
