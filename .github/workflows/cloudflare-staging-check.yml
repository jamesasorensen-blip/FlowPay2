name: Cloudflare staging connection check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-check
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Worker syntax
        run: node --check cloudflare/staging-worker.mjs
      - name: Test read-only connection checker
        run: python3 -m unittest discover -s cloudflare/tests -v

  inspect-staging:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect staging settings without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 cloudflare/scripts/check_staging.py
