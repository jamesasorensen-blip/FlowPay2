name: Staging MFA security tests
on:
  push:
    branches: [security/mfa-staging-gate]
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'tests/mfa-enforcement.test.mjs'
      - '.github/workflows/staging-mfa-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mfa-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test MFA gate
        run: node --test tests/mfa-enforcement.test.mjs
