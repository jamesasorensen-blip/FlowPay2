name: FlowPay frontend checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Repository currently has no package-lock.json; npm ci requires one.
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify production Docker image builds
        run: docker build --tag flowpay-frontend-ci .
